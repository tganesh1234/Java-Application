spring.application.name=demo

# --- Datasource (H2 in-memory; data is lost on restart) ---
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- H2 web console: http://localhost:8080/h2-console ---
# JDBC URL: jdbc:h2:mem:testdb   user: sa   password: (blank)
# DEV ONLY. Disable before deploying: SecurityConfig must permit this path
# and disable frame options for it, which you do not want in production.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT ---
# Base64-encoded 256-bit key, required by HS256. Randomly generated for local dev.
# DO NOT ship this value. In production override it with an environment variable:
#   APP_JWT_SECRET=<your-secret>
# Changing the secret invalidates every previously issued token.
app.jwt.secret=${APP_JWT_SECRET:Y6ZYlhtc39Nk+AcNQltRaTvoC1dUK4dfqwtRe5R1gNs=}

# Access-token lifetime in milliseconds (86400000 = 24 hours).
# There are no refresh tokens and no logout, so a token stays valid until it expires.
app.jwt.expiration-ms=86400000
